name: Titan Multi-Platform Build

on:
  push:
    branches: [ main ]

jobs:
  # Job for Android (Splits into ARM and ARM64)
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [android-arm, android-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build APK
        run: |
          echo "flet" > requirements.txt
          yes | flet build apk --arch ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: Titan-${{ matrix.platform }}
          path: build/apk/app-release.apk

  # Job for Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build Windows
        run: |
          echo "flet" > requirements.txt
          flet build windows
      - uses: actions/upload-artifact@v4
        with:
          name: Titan-Windows
          path: build/windows